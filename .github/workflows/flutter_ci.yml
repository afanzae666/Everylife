name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs:
      - analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android --project-name everylife --no-pub .

      - name: Configure EveryLife Android splash
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-v21
          mkdir -p android/app/src/main/res/values-v31

          cp assets/images/everylife_logo.png \
            android/app/src/main/res/drawable/everylife_logo.png

          cp assets/images/everylife_logo.png \
            android/app/src/main/res/drawable-v21/everylife_logo.png

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />

              <item
                  android:gravity="center"
                  android:drawable="@drawable/everylife_logo" />
          </layer-list>
          EOF

          cat > android/app/src/main/res/drawable-v21/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />

              <item
                  android:gravity="center"
                  android:drawable="@drawable/everylife_logo" />
          </layer-list>
          EOF

          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="LaunchTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowSplashScreenBackground">
                      @android:color/white
                  </item>

                  <item name="android:windowSplashScreenAnimatedIcon">
                      @drawable/everylife_logo
                  </item>

                  <item name="android:windowSplashScreenAnimationDuration">
                      200
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>
              </style>

          </resources>
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: everylife-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
