name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    needs:
      - analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.3
          cache: true
          pub-cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --platforms=android --project-name everylife --no-pub .

      - name: Configure EveryLife Android splash
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/drawable-v21
          mkdir -p android/app/src/main/res/values-v31

          cp assets/images/everylife_logo.png \
            android/app/src/main/res/drawable/everylife_logo.png

          cp assets/images/everylife_logo.png \
            android/app/src/main/res/drawable-v21/everylife_logo.png

          cat > android/app/src/main/res/drawable/everylife_splash_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item
                  android:width="180dp"
                  android:height="72dp"
                  android:gravity="center">

                  <bitmap
                      android:src="@drawable/everylife_logo"
                      android:gravity="fill" />

              </item>

          </layer-list>
          EOF

          cat > android/app/src/main/res/drawable-v21/everylife_splash_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item
                  android:width="180dp"
                  android:height="72dp"
                  android:gravity="center">

                  <bitmap
                      android:src="@drawable/everylife_logo"
                      android:gravity="fill" />

              </item>

          </layer-list>
          EOF

          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item android:drawable="@android:color/white" />

              <item
                  android:drawable="@drawable/everylife_splash_logo"
                  android:gravity="center" />

          </layer-list>
          EOF

          cat > android/app/src/main/res/drawable-v21/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">

              <item android:drawable="@android:color/white" />

              <item
                  android:drawable="@drawable/everylife_splash_logo"
                  android:gravity="center" />

          </layer-list>
          EOF

          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="LaunchTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:windowSplashScreenBackground">
                      @android:color/white
                  </item>

                  <item name="android:windowSplashScreenAnimatedIcon">
                      @drawable/everylife_splash_logo
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

              </style>

          </resources>
          EOF

      - name: Configure Everylife launcher icon
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow

          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageOps

          source_path = Path("assets/images/app_icon.png")
          if not source_path.is_file():
              raise FileNotFoundError(
                  f"Launcher icon not found: {source_path}"
              )

          source = Image.open(source_path).convert("RGBA")

          if source.size != (1024, 1024):
              raise RuntimeError(
                  f"Expected a 1024x1024 icon, got {source.size}"
              )

          res = Path("android/app/src/main/res")

          standard_sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          adaptive_scales = {
              "mdpi": 1,
              "hdpi": 1.5,
              "xhdpi": 2,
              "xxhdpi": 3,
              "xxxhdpi": 4,
          }

          # Standard launcher icons.
          for density, size in standard_sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  source,
                  (size, size),
                  method=Image.Resampling.LANCZOS,
              )

              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Adaptive icon foregrounds with a safe margin.
          for density, scale in adaptive_scales.items():
              canvas_size = round(108 * scale)
              logo_size = round(72 * scale)

              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              logo = ImageOps.contain(
                  source,
                  (logo_size, logo_size),
                  method=Image.Resampling.LANCZOS,
              )

              canvas = Image.new(
                  "RGBA",
                  (canvas_size, canvas_size),
                  (0, 0, 0, 0),
              )

              position = (
                  (canvas_size - logo.width) // 2,
                  (canvas_size - logo.height) // 2,
              )

              canvas.alpha_composite(logo, position)
              canvas.save(folder / "ic_launcher_foreground.png")

          # White background for adaptive icons.
          values_dir = res / "values"
          values_dir.mkdir(parents=True, exist_ok=True)

          (values_dir / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#FFFFFF</color>\n'
              '</resources>\n',
              encoding="utf-8",
          )

          # Android 8+ adaptive launcher icons.
          adaptive_dir = res / "mipmap-anydpi-v26"
          adaptive_dir.mkdir(parents=True, exist_ok=True)

          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon '
              'xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background '
              'android:drawable="@color/ic_launcher_background" />\n'
              '    <foreground '
              'android:drawable="@mipmap/ic_launcher_foreground" />\n'
              '</adaptive-icon>\n'
          )

          (adaptive_dir / "ic_launcher.xml").write_text(
              adaptive_xml,
              encoding="utf-8",
          )

          (adaptive_dir / "ic_launcher_round.xml").write_text(
              adaptive_xml,
              encoding="utf-8",
          )

          # Change only the app label and launcher icon references.
          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(encoding="utf-8")

          match = re.search(
              r"<application\b[^>]*>",
              manifest,
              flags=re.DOTALL,
          )

          if not match:
              raise RuntimeError(
                  "Could not find the Android application tag"
              )

          app_tag = match.group(0)

          def set_android_attribute(tag, attribute, value):
              pattern = rf'\bandroid:{attribute}="[^"]*"'
              replacement = f'android:{attribute}="{value}"'

              if re.search(pattern, tag):
                  return re.sub(
                      pattern,
                      lambda _: replacement,
                      tag,
                      count=1,
                  )

              return tag[:-1] + f' {replacement}>'

          app_tag = set_android_attribute(
              app_tag,
              "label",
              "Everylife",
          )

          app_tag = set_android_attribute(
              app_tag,
              "icon",
              "@mipmap/ic_launcher",
          )

          app_tag = set_android_attribute(
              app_tag,
              "roundIcon",
              "@mipmap/ic_launcher_round",
          )

          manifest = (
              manifest[:match.start()]
              + app_tag
              + manifest[match.end():]
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          print(
              "Launcher icons generated; app label set to Everylife."
          )
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: everylife-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
